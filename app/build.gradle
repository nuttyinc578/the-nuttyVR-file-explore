plugins { id 'com.android.application' }
android {
    namespace 'com.nuttyvr.explorer'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nuttyvr.explorer'
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName '1.2.0'
    }
    signingConfigs {
        release {
            storeFile file('../signing/nuttyvr.jks')
            storePassword System.getenv('NUTTYVR_STORE_PASSWORD')
            keyAlias 'nuttyvr'
            keyPassword System.getenv('NUTTYVR_STORE_PASSWORD')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError true; checkReleaseBuilds true }
}

tasks.register('fetchArchiveDependencies', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/fetch_dependencies.py'
}
def archiveLibraryFiles = new groovy.json.JsonSlurper().parse(file('libs/dependencies.json')).collect { file("libs/${it.file}") }
def archiveLibraries = files(archiveLibraryFiles).builtBy(tasks.named('fetchArchiveDependencies'))
preBuild.dependsOn tasks.named('fetchArchiveDependencies')
dependencies { implementation archiveLibraries }
