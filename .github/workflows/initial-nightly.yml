name: Publish initial nightly

"on":
  push:
    branches: [main]
    paths:
      - 'prebuilt/nightly/**'
      - '.github/workflows/initial-nightly.yml'
      - 'tools/prepare_prebuilt_nightly.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuttyvr-nightly
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'nuttyinc578/the-nuttyVR-file-explore' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install APK verification tools
        run: sdkmanager 'build-tools;35.0.0'
      - name: Test the app
        run: bash test.sh
      - name: Verify snapshot, source fingerprint and signer
        env:
          NUTTYVR_BUILD_TOOLS: '35.0.0'
        run: python3 tools/prepare_prebuilt_nightly.py
      - name: Publish initial nightly download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUTTYVR_COMMIT: ${{ github.sha }}
          NUTTYVR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NUTTYVR_INITIAL_ONLY: '1'
        run: python3 tools/publish_nightly.py
