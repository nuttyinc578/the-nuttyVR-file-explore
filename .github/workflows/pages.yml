name: Deploy NuttyVR website

"on":
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
      - 'tools/check_website.cjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'nuttyinc578/the-nuttyVR-file-explore' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: node --check website/app.js
      - name: Prepare browser checks
        run: npm install --prefix "$RUNNER_TEMP/nuttyvr-browser-check" --no-package-lock --no-audit --no-fund playwright
      - name: Check desktop and mobile interactions
        env:
          NUTTYVR_PLAYWRIGHT_PATH: ${{ runner.temp }}/nuttyvr-browser-check/node_modules/playwright
        run: node tools/check_website.cjs
      - name: Save desktop and mobile previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-previews
          path: build/website-qa/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
