name: Nightly APK

"on":
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuttyvr-nightly
  cancel-in-progress: false

jobs:
  check-signing:
    if: github.repository == 'nuttyinc578/the-nuttyVR-file-explore' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.signer.outputs.ready }}
    steps:
      - name: Check nightly signing setup
        id: signer
        env:
          KEYSTORE: ${{ secrets.NUTTYVR_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.NUTTYVR_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Automatic nightly builds are waiting for the two signing secrets. See docs/NIGHTLY.md. The initial nightly download is published separately.' >> "$GITHUB_STEP_SUMMARY"
          fi
  build:
    needs: check-signing
    if: needs.check-signing.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NUTTYVR_BUILD_TOOLS: '35.0.0'
      NUTTYVR_STORE_PASSWORD: ${{ secrets.NUTTYVR_STORE_PASSWORD }}
      NUTTYVR_APK_NAME: NuttyVR-File-Explorer-nightly.apk
      NUTTYVR_VERSION_NAME: 1.2.0-nightly.${{ github.run_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set temporary signing path
        run: echo "NUTTYVR_KEYSTORE=$RUNNER_TEMP/nuttyvr-signing/nuttyvr.jks" >> "$GITHUB_ENV"
      - name: Restore private release signer
        env:
          NUTTYVR_KEYSTORE_BASE64: ${{ secrets.NUTTYVR_KEYSTORE_BASE64 }}
        run: python3 tools/prepare_ci_signing.py
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test file operations, APK snapshots and archives
        run: bash test.sh
      - name: Build and verify signed nightly
        run: bash build.sh
      - name: Save signed APK and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuttyvr-nightly
          path: |
            dist/NuttyVR-File-Explorer-nightly.apk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Remove private signing key
        if: always()
        run: rm -f -- "$NUTTYVR_KEYSTORE"

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuttyvr-nightly
          path: dist
      - name: Publish permanent nightly download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUTTYVR_COMMIT: ${{ github.sha }}
          NUTTYVR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/publish_nightly.py
